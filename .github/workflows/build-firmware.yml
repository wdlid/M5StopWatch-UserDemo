name: Build Firmware

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'fix/**'
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_toolchain:
        description: 'Toolchain to build with'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'platformio'
          - 'esp-idf'

permissions:
  contents: write

jobs:
  build-platformio:
    name: Build (PlatformIO)
    if: github.event_name != 'workflow_dispatch' || inputs.build_toolchain == 'all' || inputs.build_toolchain == 'platformio'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-${{ hashFiles('repos.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build firmware with PlatformIO
        run: |
          pio run

      - name: Prepare firmware distribution & factory binary
        run: |
          mkdir -p dist
          BUILD_DIR=".pio/build/m5stack-stopwatch"
          
          # Copy standalone binaries
          cp "${BUILD_DIR}/firmware.bin" dist/firmware-ota.bin
          cp "${BUILD_DIR}/bootloader.bin" dist/bootloader.bin
          cp "${BUILD_DIR}/partitions.bin" dist/partitions.bin
          if [ -f "${BUILD_DIR}/ota_data_initial.bin" ]; then
            cp "${BUILD_DIR}/ota_data_initial.bin" dist/ota_data_initial.bin
          fi
          
          # Generate complete factory image (flashable directly at 0x0)
          # Note: ESP32-S3 with Octal PSRAM requires DIO flash mode, not QIO.
          python -m esptool --chip esp32s3 merge_bin \
            -o dist/m5stopwatch-factory-0x0.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 "${BUILD_DIR}/bootloader.bin" \
            0x8000 "${BUILD_DIR}/partitions.bin" \
            0xd000 "${BUILD_DIR}/ota_data_initial.bin" \
            0x20000 "${BUILD_DIR}/firmware.bin"
          
          # Generate SHA256 checksums
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd ..

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m5stopwatch-firmware-platformio-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'M5Stack StopWatch Latest Build' }}
          files: |
            dist/*.bin
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## M5Stack StopWatch Firmware Build

            ### 刷入说明 / How to Flash:
            - **`m5stopwatch-factory-0x0.bin` (USB 线刷 / 初次烧录推荐)**:
              全合一固件（包含 bootloader + 分区表 + 固件）。
              使用 esptool 烧录到 `0x0` 地址：
              ```bash
              esptool.py --chip esp32s3 write_flash 0x0 m5stopwatch-factory-0x0.bin
              ```
              或直接在网页烧录器（ESP Web Flasher / M5Burner）选择此文件单文件烧录。
            - **`firmware-ota.bin` (OTA 无线升级专用)**:
              在手表上进入 **Settings -> Firmware -> OTA Update**，在手机/电脑浏览器打开屏幕显示的地址（如 `http://192.168.4.1/ota`），上传此文件即可自动完成 OTA 升级并重启。

  build-esp-idf:
    name: Build (ESP-IDF v5.5)
    if: github.event_name != 'workflow_dispatch' || inputs.build_toolchain == 'all' || inputs.build_toolchain == 'esp-idf'
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure safe directory for Git
        run: git config --global --add safe.directory '*'

      - name: Fetch component dependencies
        run: |
          . $IDF_PATH/export.sh
          python3 ./fetch_repos.py

      - name: Build firmware with ESP-IDF
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Prepare ESP-IDF artifacts
        run: |
          mkdir -p dist-idf
          cp build/StopWatch-UserDemo.bin dist-idf/firmware-ota.bin
          cp build/bootloader/bootloader.bin dist-idf/bootloader.bin
          cp build/partition_table/partition-table.bin dist-idf/partitions.bin
          if [ -f build/ota_data_initial.bin ]; then
            cp build/ota_data_initial.bin dist-idf/ota_data_initial.bin
          fi

          python -m esptool --chip esp32s3 merge_bin \
            -o dist-idf/m5stopwatch-factory-0x0.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xd000 build/ota_data_initial.bin \
            0x20000 build/StopWatch-UserDemo.bin

          cd dist-idf
          sha256sum * > SHA256SUMS
          cd ..

      - name: Upload ESP-IDF firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m5stopwatch-firmware-espidf-${{ github.sha }}
          path: dist-idf/
          retention-days: 14

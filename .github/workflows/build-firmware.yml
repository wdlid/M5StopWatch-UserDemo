name: Build Firmware

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_toolchain:
        description: 'Toolchain to build with'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'platformio'
          - 'esp-idf'

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Firmware Version
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      !startsWith(github.event.head_commit.message, 'chore: bump version to ')
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
      bumped_sha: ${{ steps.bump.outputs.bumped_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push commit + tag
        id: bump
        run: |
          BUMP_OUT=$(python3 scripts/bump_version.py)
          echo "$BUMP_OUT"
          NEW_VERSION=$(echo "$BUMP_OUT" | grep '^NEW_VERSION=' | cut -d= -f2)
          NEW_TAG=$(echo "$BUMP_OUT" | grep '^NEW_TAG=' | cut -d= -f2)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add main/apps/common/common.h
          if [ -f main/apps/common/audio/common.h ]; then
            git add main/apps/common/audio/common.h
          fi

          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git tag -f -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin HEAD:${GITHUB_REF} "refs/tags/${NEW_TAG}"

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "bumped_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-platformio:
    name: Build (PlatformIO)
    needs: [bump-version]
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.build_toolchain == 'all' || inputs.build_toolchain == 'platformio')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.bumped_sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}-${{ hashFiles('repos.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build firmware with PlatformIO
        run: |
          pio run -e m5stack-stopwatch
          pio run -e m5stack-stopwatch-recovery

      - name: Prepare firmware distribution & factory binary
        run: |
          mkdir -p dist
          BUILD_DIR=".pio/build/m5stack-stopwatch"
          BUILD_REC_DIR=".pio/build/m5stack-stopwatch-recovery"
          
          # Copy standalone binaries
          cp "${BUILD_DIR}/firmware.bin" dist/firmware-ota.bin
          cp "${BUILD_REC_DIR}/firmware.bin" dist/recovery.bin
          cp "${BUILD_DIR}/bootloader.bin" dist/bootloader.bin
          cp "${BUILD_DIR}/partitions.bin" dist/partitions.bin
          if [ -f "${BUILD_DIR}/ota_data_initial.bin" ]; then
            cp "${BUILD_DIR}/ota_data_initial.bin" dist/ota_data_initial.bin
          fi
          
          # Generate complete factory image (flashable directly at 0x0)
          # Note: ESP32-S3 with Octal PSRAM requires DIO flash mode, not QIO.
          python3 scripts/merge_factory_bin.py
          cp m5stopwatch-factory-0x0.bin dist/m5stopwatch-factory-0x0.bin
          
          # Generate SHA256 checksums
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd ..

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m5stopwatch-firmware-platformio-${{ needs.bump-version.outputs.bumped_sha || github.sha }}
          path: dist/
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.new_tag || 'latest' }}
          name: ${{ needs.bump-version.outputs.new_version || 'M5Stack StopWatch Latest Build' }}
          files: |
            dist/*.bin
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## M5Stack StopWatch Firmware Build (${{ needs.bump-version.outputs.new_version || 'latest' }})

            ### 刷入说明 / How to Flash:
            - **`m5stopwatch-factory-0x0.bin` (USB 线刷 / 初次烧录推荐)**:
              全合一出厂固件（包含 bootloader + 分区表 + 主固件 + 极简 Recovery 救砖系统）。
              使用 esptool 烧录到 `0x0` 地址：
              ```bash
              esptool.py --chip esp32s3 write_flash 0x0 m5stopwatch-factory-0x0.bin
              ```
              或直接在网页烧录器（ESP Web Flasher / M5Burner）选择此文件单文件烧录。
            - **`firmware-ota.bin` (OTA 无线升级专用)**:
              主应用固件升级包（烧录至 `0x20000`）。在手表设置中检查更新自动下载，或进入 Web OTA 上传升级。
            - **`recovery.bin` (Recovery 恢复固件专用)**:
              极简恢复固件（烧录至 `0x5A0000`）。

  build-esp-idf:
    name: Build (ESP-IDF v5.5)
    needs: [bump-version]
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.build_toolchain == 'all' || inputs.build_toolchain == 'esp-idf')
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.bumped_sha || github.sha }}

      - name: Configure safe directory for Git
        run: git config --global --add safe.directory '*'

      - name: Fetch component dependencies
        run: |
          . $IDF_PATH/export.sh
          python3 ./fetch_repos.py

      - name: Build firmware with ESP-IDF
        run: |
          . $IDF_PATH/export.sh
          idf.py build
          BUILD_RECOVERY=1 idf.py -B build_recovery build

      - name: Prepare ESP-IDF artifacts
        run: |
          . $IDF_PATH/export.sh
          mkdir -p dist-idf
          cp build/StopWatch-UserDemo.bin dist-idf/firmware-ota.bin
          if [ -f build_recovery/StopWatch-UserDemo.bin ]; then
            cp build_recovery/StopWatch-UserDemo.bin dist-idf/recovery.bin
          fi
          cp build/bootloader/bootloader.bin dist-idf/bootloader.bin
          cp build/partition_table/partition-table.bin dist-idf/partitions.bin
          if [ -f build/ota_data_initial.bin ]; then
            cp build/ota_data_initial.bin dist-idf/ota_data_initial.bin
          fi

          MERGE_ARGS=(
            --chip esp32s3 merge_bin
            -o dist-idf/m5stopwatch-factory-0x0.bin
            --flash_mode dio --flash_freq 80m --flash_size 16MB
            0x0 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0xd000 build/ota_data_initial.bin
            0x20000 build/StopWatch-UserDemo.bin
          )
          if [ -f build_recovery/StopWatch-UserDemo.bin ]; then
            MERGE_ARGS+=(0x5A0000 build_recovery/StopWatch-UserDemo.bin)
          fi

          python -m esptool "${MERGE_ARGS[@]}"

          cd dist-idf
          sha256sum * > SHA256SUMS
          cd ..

      - name: Upload ESP-IDF firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m5stopwatch-firmware-espidf-${{ needs.bump-version.outputs.bumped_sha || github.sha }}
          path: dist-idf/
          retention-days: 14

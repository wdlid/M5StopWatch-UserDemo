<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M5StopWatch LVGL Web Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: radial-gradient(circle at top, #1f2430, #0d1017 70%);
      color: #e5e9f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .watch-shell {
      position: relative;
      padding: 22px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2b303c, #161920);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.65),
        inset 0 2px 4px rgba(255, 255, 255, 0.12),
        inset 0 -4px 10px rgba(0, 0, 0, 0.6);
    }
    .screen-mask {
      width: 466px;
      height: 466px;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.08);
    }
    canvas.emscripten {
      display: block;
      width: 466px;
      height: 466px;
      border: 0;
      outline: none;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hw-btn {
      padding: 10px 18px;
      border: 1px solid #3b4252;
      border-radius: 10px;
      background: #232834;
      color: #eceff4;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: transform 0.06s ease, background 0.12s ease;
    }
    .hw-btn:active, .hw-btn.pressed {
      transform: scale(0.96);
      background: #4c566a;
    }
    .hint {
      font-size: 12px;
      color: #8892a6;
      text-align: center;
    }
    #status {
      font-size: 13px;
      color: #8fbcbb;
    }
  </style>
</head>
<body>
  <div class="watch-shell">
    <div class="screen-mask">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>
  </div>

  <div class="controls">
    <button class="hw-btn" data-btn="0">Btn A (Key: 1 / A)</button>
    <button class="hw-btn" data-btn="1">Btn B (Key: 2 / B)</button>
    <button class="hw-btn" data-btn="2">PWR (Key: Esc / P)</button>
  </div>
  <div id="status">Loading WebAssembly...</div>
  <div class="hint">Drag or click on the 466×466 circular screen to interact with LVGL</div>

  <script>
    var statusElement = document.getElementById('status');
    var Module = {
      canvas: (function() {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('webglcontextlost', function(e) {
          alert('WebGL context lost. Reload the page.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function(text) {
        statusElement.textContent = text || 'Running (466×466 LVGL + SDL2)';
      }
    };

    function bindButton(el) {
      var id = parseInt(el.getAttribute('data-btn'), 10);
      var setState = function(pressed) {
        if (pressed) el.classList.add('pressed');
        else el.classList.remove('pressed');
        if (typeof Module._sim_set_button === 'function') {
          Module._sim_set_button(id, pressed ? 1 : 0);
        }
      };
      el.addEventListener('pointerdown', function(e) { e.preventDefault(); setState(true); });
      el.addEventListener('pointerup', function() { setState(false); });
      el.addEventListener('pointerleave', function() { setState(false); });
      el.addEventListener('pointercancel', function() { setState(false); });
    }
    document.querySelectorAll('.hw-btn').forEach(bindButton);
  </script>
  {{{ SCRIPT }}}
</body>
</html>
